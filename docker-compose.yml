services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  api:
    build: ./backend
    depends_on:
      - db
 
    env_file: .env
    environment:
      DB_HOST: db

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8090:80"

volumes:
  db-data:
